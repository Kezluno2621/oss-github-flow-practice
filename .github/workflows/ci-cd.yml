
name: Python CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build calculator package
        run: |
          mkdir -p dist
          python -m zipfile -c dist/calculator-package.zip calculator.py test_calculator.py README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: dist/calculator-package.zip
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-build
          path: dist

      - name: Extract calculator package
        run: python -m zipfile -e dist/calculator-package.zip .

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Lint
        run: ruff check calculator.py test_calculator.py

      - name: Run Unit Tests
        run: python -m unittest discover -v

  deploy:
    name: Deploy (Simulation)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-build
          path: dist

      - name: Verify deployment secret
        env:
          DEPLOY_TOKEN: ${{ secrets.DEMO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Deployment secret is missing"
            exit 1
          fi
          echo "Deployment secret is configured"

      - name: Simulate deployment
        run: |
          mkdir -p deployed
          cp dist/calculator-package.zip deployed/
          echo "Deployment simulation successful" > deployed/deployment-status.txt
          echo "Artifact prepared for deployment"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-deployment
          path: deployed/
          if-no-files-found: error
