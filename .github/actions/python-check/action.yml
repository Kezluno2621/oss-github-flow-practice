name: Python Quality Check

description: Run Ruff lint and unittest for Python projects

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Ruff
      shell: bash
      run: python -m pip install ruff

    - name: Run Ruff Lint
      shell: bash
      run: python -m ruff check calculator.py test_calculator.py

    - name: Run Unit Tests
      shell: bash
      run: python -m unittest discover -v
